<!-- public/index.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 Controller | Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="glass-bg"></div>
  <div class="container">
    <header>
      <h1><i class="fas fa-microchip"></i> ESP32 Remote Manager</h1>
      <div class="status-bar">
        <div id="wsStatus" class="status offline"><i class="fas fa-plug"></i> Déconnecté</div>
        <div id="espStatus" class="esp-info"><i class="fas fa-server"></i> Aucun ESP32</div>
      </div>
    </header>

    <div class="cards-grid" id="cardsGrid">
      <!-- Les cartes seront générées dynamiquement -->
    </div>

    <div class="toast" id="toast">Message</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
